apply plugin: 'com.android.application'
def professionalEdition = project.findProperty('machadoProfessional') == 'true'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) signingProperties.load(new FileInputStream(signingPropertiesFile))
if (!signingPropertiesFile.exists() && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('Configure android/keystore.properties para gerar uma versão assinada.')
}
def accessProperties = new Properties()
def accessPropertiesFile = rootProject.file('native-access.properties')
if (!professionalEdition && accessPropertiesFile.exists()) accessProperties.load(new FileInputStream(accessPropertiesFile))
if (!professionalEdition && (!accessProperties['email'] || !accessProperties['password']) && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('Execute npm run android:prepare-access para configurar o acesso privado do APK.')
}

android {
    buildFeatures { buildConfig = true }
    namespace = "com.barbeariamachado.gestao"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId professionalEdition ? "com.barbeariamachado.profissional" : "com.barbeariamachado.gestao"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode professionalEdition ? 1 : 26
        versionName professionalEdition ? "1.0.0" : "1.19.5"
        manifestPlaceholders = [machadoAppName: professionalEdition ? 'Machado Profissional' : 'Machado Gestão', machadoAppIcon: professionalEdition ? '@drawable/professional_icon' : '@mipmap/ic_launcher', machadoRoundIcon: professionalEdition ? '@drawable/professional_icon' : '@mipmap/ic_launcher_round']
        buildConfigField 'String', 'MANAGED_EMAIL', groovy.json.JsonOutput.toJson(accessProperties.getProperty('email', ''))
        buildConfigField 'String', 'MANAGED_PASSWORD', groovy.json.JsonOutput.toJson(accessProperties.getProperty('password', ''))
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
